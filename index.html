<title>Thư viện pháp lý dự án</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Bricolage+Grotesque:wght@600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: lối vào theo tuyến dự án (giai đoạn → công việc → văn bản), tra cứu theo lĩnh vực là lối vào thứ hai.
   Palette: nền giấy bản vẽ xanh xám, mực đậm, một màu nhấn xanh petrol; vàng, đỏ, xanh lá chỉ dùng cho trạng thái hiệu lực. */
:root{
  --bg:#f1f4f3; --surface:#ffffff; --surface-2:#e8eeec; --ink:#10201e; --muted:#51615d; --faint:#7a8985;
  --line:#d3dcd9; --line-strong:#a9b8b3; --accent:#0d5b73; --accent-ink:#ffffff; --accent-soft:#d9eaef;
  --ok:#256f3f; --ok-soft:#dff0e5; --warn:#8a5a0b; --warn-soft:#f8ecd0; --bad:#a23a2b; --bad-soft:#f6dfda;
  --mark:#ffe58a; --shadow:0 1px 2px rgba(16,32,30,.06),0 8px 24px rgba(16,32,30,.07);
  --f-body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-display:"Bricolage Grotesque","Be Vietnam Pro",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1716; --surface:#16211f; --surface-2:#1d2b28; --ink:#e6efed; --muted:#a2b4af; --faint:#7d908b;
  --line:#2a3a37; --line-strong:#43574f; --accent:#6cc3dc; --accent-ink:#06222b; --accent-soft:#17323a;
  --ok:#74d196; --ok-soft:#173424; --warn:#e9be68; --warn-soft:#3a2d12; --bad:#f09a8b; --bad-soft:#3d1f1a;
  --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1716; --surface:#16211f; --surface-2:#1d2b28; --ink:#e6efed; --muted:#a2b4af; --faint:#7d908b;
  --line:#2a3a37; --line-strong:#43574f; --accent:#6cc3dc; --accent-ink:#06222b; --accent-soft:#17323a;
  --ok:#74d196; --ok-soft:#173424; --warn:#e9be68; --warn-soft:#3a2d12; --bad:#f09a8b; --bad-soft:#3d1f1a;
  --mark:#6b5a12; --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;padding-inline:clamp(16px,4vw,40px);padding-block:0 56px;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.wrap{max-width:1120px;margin-inline:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand i{display:block;width:26px;height:26px;border-radius:7px;background:var(--accent);position:relative}
.brand i::before{content:"";position:absolute;left:5px;right:5px;top:12px;height:2px;background:var(--accent-ink);opacity:.9}
.brand i::after{content:"";position:absolute;left:5px;top:8px;width:6px;height:6px;border-radius:50%;background:var(--accent-ink);box-shadow:10px 0 0 var(--accent-ink)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;font-size:13px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(16,32,30,.12)}

/* hero + search */
.hero{padding-block:14px 8px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(28px,5vw,44px);line-height:1.08;letter-spacing:-.025em;margin:0 0 6px;text-wrap:balance;max-width:20ch}
.hero p{margin:0;color:var(--muted);max-width:60ch}
.search{position:relative;margin-top:22px}
.search svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:var(--faint);pointer-events:none}
.search input{width:100%;height:58px;border-radius:16px;border:1.5px solid var(--line-strong);background:var(--surface);padding:0 92px 0 52px;font-size:16px;box-shadow:var(--shadow)}
.search input::placeholder{color:var(--faint)}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.search kbd{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-family:var(--f-mono);font-size:12px;color:var(--faint);border:1px solid var(--line);border-radius:6px;padding:1px 7px}
.search .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);width:30px;height:30px;border-radius:50%;color:var(--muted);font-size:16px;line-height:1}
.quick{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.quick button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink)}
.quick button:hover{border-color:var(--accent);color:var(--accent)}

/* route track */
.sect-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:34px 0 14px}
.track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr)) minmax(0,.85fr);position:relative}
.stop{position:relative;text-align:left;background:none;border:0;padding:32px 14px 8px 0;min-width:0;color:var(--ink)}
.stop::before{content:"";position:absolute;top:11px;left:24px;right:2px;border-top:2px dashed var(--line-strong)}
.stop:nth-child(6)::before{right:2px}
.stop:last-child::before{display:none}
.mark-dot{position:absolute;top:0;left:0;width:24px;height:24px;border-radius:50%;border:2px solid var(--line-strong);background:var(--bg);display:grid;place-items:center;font:500 11px var(--f-mono);color:var(--muted);transition:background .15s,border-color .15s}
.stop:hover .mark-dot{border-color:var(--accent);color:var(--accent)}
.stop[aria-pressed="true"] .mark-dot{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.stop b{display:block;font-size:14px;line-height:1.3;font-weight:600}
.stop[aria-pressed="true"] b{color:var(--accent)}
.stop small{display:block;color:var(--muted);font-size:12px;line-height:1.4;margin-top:3px}
.stop .cnt{display:inline-block;margin-top:6px;font:500 11px var(--f-mono);color:var(--faint)}
.stop.extra .mark-dot{border-style:dashed}
.stop:hover b{text-decoration:underline;text-underline-offset:3px;text-decoration-color:var(--line-strong)}

/* section panels */
.panel{margin-top:26px;scroll-margin-top:12px}
.crumbs{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs button{border:0;background:none;padding:0;color:var(--accent);font-size:13px}
.crumbs button:hover{text-decoration:underline}
.crumbs span[aria-hidden]{color:var(--line-strong)}
.panel h2{font-family:var(--f-display);font-weight:700;font-size:clamp(22px,3.4vw,28px);line-height:1.15;letter-spacing:-.02em;margin:0 0 4px;text-wrap:balance}
.panel .lede{margin:0;color:var(--muted);max-width:62ch}

.tasks{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;margin-top:18px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;min-width:0;transition:border-color .15s,box-shadow .15s}
.task:hover{border-color:var(--accent);box-shadow:var(--shadow)}
.task b{font-size:15.5px;line-height:1.3;font-weight:600}
.task span.ask{color:var(--muted);font-size:13px;line-height:1.45}
.task .meta{margin-top:auto;padding-top:8px;display:flex;justify-content:space-between;gap:8px;font:500 12px var(--f-mono);color:var(--faint)}
.task .meta em{font-style:normal;color:var(--accent)}

/* mind map */
.alsorow{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;margin-top:14px;font-size:13px;color:var(--muted)}
.alsorow button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px}
.alsorow button:hover{border-color:var(--accent);color:var(--accent)}
.map{display:grid;grid-template-columns:minmax(150px,230px) minmax(0,1fr);gap:0 0;margin-top:22px;align-items:center}
.map-root{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:16px;position:relative}
.map-root b{display:block;font-family:var(--f-display);font-size:17px;line-height:1.2}
.map-root small{display:block;margin-top:4px;opacity:.85;font-size:12px}
.map-root::after{content:"";position:absolute;left:100%;top:50%;width:30px;border-top:2px solid var(--line-strong)}
.branches{list-style:none;margin:0 0 0 30px;padding:0 0 0 0;display:grid;gap:8px;position:relative;min-width:0}
.branches::before{content:"";position:absolute;left:0;top:26px;bottom:26px;border-left:2px solid var(--line-strong)}
.branches li{position:relative;padding-left:26px;min-width:0}
.branches li::before{content:"";position:absolute;left:0;top:50%;width:26px;border-top:2px solid var(--line-strong)}
.branch{width:100%;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;align-items:center}
.branch:hover{border-color:var(--accent)}
.branch[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.branch b{font-size:14.5px;font-weight:600}
.branch small{grid-column:1;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.branch .n{grid-row:1/3;grid-column:2;font:500 18px var(--f-mono);color:var(--accent)}
.branch{text-align:left;align-content:center}
.branch.empty{opacity:.5;padding-block:7px;background:transparent;border-style:dashed}
.branch.empty small{display:none}
.branch.empty .n{grid-row:1;font-size:14px}

/* controls */
.controls{margin-top:26px;display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--muted)}
.chip:hover{border-color:var(--accent);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.ctl-right{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);cursor:pointer;user-select:none}
.toggle input{appearance:none;width:34px;height:20px;border-radius:999px;background:var(--line-strong);position:relative;margin:0;cursor:pointer;transition:background .15s}
.toggle input::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .15s}
.toggle input:checked{background:var(--accent)}
.toggle input:checked::after{transform:translateX(14px)}
.sel{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 10px;font-size:13px;max-width:100%}
details.adv{margin-top:10px;font-size:13px}
details.adv summary{cursor:pointer;color:var(--accent);font-weight:500;list-style:none;display:inline-flex;gap:6px;align-items:center}
details.adv summary::-webkit-details-marker{display:none}
details.adv summary::before{content:"+";font-family:var(--f-mono)}
details.adv[open] summary::before{content:"–"}
.adv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-top:10px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.adv-grid label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.adv-grid .sel{width:100%}

.countline{margin:18px 0 8px;font-size:13px;color:var(--muted);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.countline b{color:var(--ink);font-variant-numeric:tabular-nums}

/* rows */
.list{list-style:none;margin:0;padding:0;display:grid;gap:0;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:0 8px;align-items:start;border-bottom:1px solid var(--line);padding-block:2px}
.row-main{display:grid;grid-template-columns:38px minmax(0,1fr);gap:12px;text-align:left;background:none;border:0;padding:14px 8px 14px 4px;border-radius:10px;min-width:0}
.row-main:hover{background:var(--surface)}
.glyph{width:38px;height:38px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font:600 12px var(--f-mono);color:var(--accent);letter-spacing:-.02em}
.row h3{margin:0;font-size:15.5px;line-height:1.38;font-weight:600;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;gap:2px 10px;margin-top:3px;font-size:12.5px;color:var(--muted);align-items:center}
.sub .no{font-family:var(--f-mono);font-size:12px;color:var(--ink);overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}
.tag{font-size:11.5px;color:var(--accent);background:var(--accent-soft);border-radius:6px;padding:1px 8px}
.row-side{display:flex;align-items:center;gap:8px;padding-top:14px}
.pill{font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.new{background:var(--accent-soft);color:var(--accent)}
.pill.soon{background:var(--warn-soft);color:var(--warn)} .pill.old{background:var(--bad-soft);color:var(--bad)}
.open{width:34px;height:34px;display:grid;place-items:center;border-radius:9px;border:1px solid var(--line);color:var(--muted);background:var(--surface);text-decoration:none}
.open:hover{color:var(--accent);border-color:var(--accent)}
.more{display:flex;justify-content:center;margin-top:20px}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:11px;padding:9px 18px;font-weight:500;font-size:14px}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn.primary:hover{color:var(--accent-ink);filter:brightness(1.08)}
.empty{padding:36px 16px;text-align:center;color:var(--muted);border:1px dashed var(--line-strong);border-radius:14px;margin-top:8px}
.ext{margin-top:18px;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 14px}

/* home extras */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:28px;margin-top:6px}
.mini>h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:30px 0 8px;font-weight:600}
.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin-top:18px}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;text-align:left;display:flex;justify-content:space-between;gap:10px;align-items:center;min-width:0}
.field:hover{border-color:var(--accent)}
.field[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.field span{font-weight:600;font-size:14px;min-width:0}
.field em{font:500 12px var(--f-mono);font-style:normal;color:var(--faint)}
.foot{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--faint);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(8,18,16,.45);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(520px,100%);background:var(--surface);z-index:41;box-shadow:-12px 0 40px rgba(0,0,0,.2);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.d-head{padding:18px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.d-head h2{margin:0;font-family:var(--f-display);font-size:20px;line-height:1.25;letter-spacing:-.01em;overflow-wrap:anywhere}
.d-close{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:36px;height:36px;flex:none;font-size:18px;line-height:1}
.d-body{overflow:auto;padding:16px 20px 28px;display:grid;gap:18px;align-content:start}
.d-body h4{margin:0 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.d-body p{margin:0}
.d-body ul{margin:0;padding-left:18px;display:grid;gap:5px}
.facts{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13.5px;margin:0}
.facts dt{color:var(--muted)} .facts dd{margin:0;overflow-wrap:anywhere}
.d-actions{display:flex;flex-wrap:wrap;gap:8px}
.menu{border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:10px;background:var(--bg)}
.menu .links{display:flex;flex-wrap:wrap;gap:8px}
.menu a,.menu button{border:1px solid var(--line-strong);background:var(--surface);border-radius:9px;padding:6px 12px;font-size:13px;text-decoration:none;color:var(--ink)}
.menu a:hover,.menu button:hover{border-color:var(--accent);color:var(--accent)}
.menu .dis{opacity:.45;pointer-events:none}
.menu small{color:var(--muted);font-size:12px}
.rel{display:grid;gap:2px}
.rel button{text-align:left;border:0;background:none;padding:7px 8px;border-radius:8px;font-size:13.5px;line-height:1.4}
.rel button:hover{background:var(--surface-2)}
.rel button span{display:block;font:12px var(--f-mono);color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media (max-width:860px){
  .track{grid-template-columns:1fr}
  .stop{padding:2px 8px 22px 44px;min-height:54px}
  .stop::before{top:26px;bottom:-2px;left:11px;right:auto;border-top:0;border-left:2px dashed var(--line-strong)}
  .stop:nth-child(6)::before{right:auto}
  .stop:last-child{padding-bottom:6px}
  .stop small{display:none}
  .mark-dot{top:2px}
  .stop .cnt{margin-top:2px}
  .map{grid-template-columns:1fr}
  .map-root::after{display:none}
  .branches{margin:14px 0 0 12px}
}
@media (max-width:560px){
  .row-main{grid-template-columns:1fr}
  .glyph{display:none}
  .row{grid-template-columns:1fr}
  .row-side{padding:0 4px 12px;justify-content:space-between;flex-direction:row-reverse}
  .search input{padding-right:52px}
  .search kbd{display:none}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><i aria-hidden="true"></i><span>Thư viện pháp lý dự án</span></div>
    <div class="seg" role="group" aria-label="Cách tra cứu">
      <button id="modeJ" aria-pressed="true">Theo hành trình</button>
      <button id="modeF" aria-pressed="false">Theo lĩnh vực</button>
    </div>
  </header>

  <section class="hero">
    <h1 id="heroTitle">Dự án của bạn đang ở bước nào?</h1>
    <p id="heroSub">Chọn giai đoạn để thấy các việc cần xử lý và văn bản làm căn cứ. Đã biết số hiệu hoặc từ khóa thì gõ thẳng vào ô tìm.</p>

i/Nghi-dinh-210-2026-ND-CP-huong-dan-Luat-Xay-dung-ve-hop-dong-xay-dung-696691.aspx","summary":"Hướng dẫn về hợp đồng xây dựng, giá hợp đồng, tạm ứng, thanh toán, điều chỉnh giá, nghiệm thu và tranh chấp.","noidung":["Quy định chi tiết và hướng dẫn thi hành Luật Xây dựng về hợp đồng xây dựng.","Quy định nguyên tắc ký kết và thực hiện hợp đồng xây dựng.","Quy định các loại hợp đồng xây dựng như tư vấn, thi công, EPC, chìa khóa trao tay.","Quy định giá hợp đồng, điều chỉnh giá hợp đồng, tạm ứng, bảo đảm, thanh toán và thanh lý."],"diemmoi":["Thay thế toàn bộ Nghị định số 37/2015/NĐ-CP và Nghị định số 50/2021/NĐ-CP.","Làm rõ cơ chế điều chỉnh giá hợp đồng khi biến động giá vật liệu, nhân công và nhiên liệu.","Bổ sung quy định chuyển đổi số trong quản lý hồ sơ hợp đồng và thanh toán điện tử.","Quy định mức tạm ứng hợp đồng không vượt quá 30% giá hợp đồng, trừ trường hợp đặc biệt."],"doc":"https://docs.google.com/document/d/1uSWPfsEED_OsopONz3EsbBYkFqw-H1Q_/edit?usp=drive_link&amp;ouid=108341869410064376302&amp;rtpof=true&amp;sd=true","pdf":"https://drive.google.com/file/d/1c7JsubSj_8vXv7fmf1ZTz0uPxs7sP7eT/view?usp=drive_link","en":"","cq":"Chính phủ","tasks":["hopdong","nghiemthu"]},{"id":"nd212","law":"xaydung","type":"Nghị định","ten":"Nghị định số 212/2026/NĐ-CP","so":"212/2026/NĐ-CP","ngaybh":"17/06/2026","hl":"01/07/2026","het":"","thaythe":"Thay thế, sửa đổi các quy định tương ứng tại Nghị định số 35/2023/NĐ-CP và Nghị định số 175/2024/NĐ-CP","link":"https://thuvienphapluat.vn/van-ban/Cong-nghe-thong-tin/Nghi-dinh-212-2026-ND-CP-dieu-kien-nang-luc-hoat-dong-xay-dung-697287.aspx","summary":"Điều kiện năng lực hoạt động xây dựng của tổ chức, cá nhân; chứng chỉ hành nghề; nhà thầu nước ngoài.","noidung":["Quy định điều kiện năng lực hoạt động xây dựng của tổ chức và cá nhân.","Quy định cấp, cấp lại, chuyển đổi và thu hồi chứng chỉ hành nghề hoạt động xây dựng.","Quy định điều kiện cấp, thu hồi giấy phép hoạt động xây dựng đối với nhà thầu nước ngoài.","Quy định xây dựng, quản lý, vận hành và khai thác Hệ thống thông tin, Cơ sở dữ liệu quốc gia về hoạt động xây dựng."],"diemmoi":["Tích hợp quản lý năng lực hoạt động xây dựng trên Hệ thống thông tin và Cơ sở dữ liệu quốc gia.","Chuẩn hóa điều kiện năng lực đối với tổ chức và cá nhân.","Chứng chỉ hành nghề cấp mới có thời hạn 10 năm.","Tăng cường số hóa hồ sơ, thủ tục hành chính trong lĩnh vực năng lực hoạt động xây dựng."],"doc":"https://docs.google.com/document/d/1HUbzZYC8m65XP8qZ-muxUnNevCfFYMn-/edit?usp=drive_link&amp;ouid=108341869410064376302&amp;rtpof=true&amp;sd=true","pdf":"https://drive.google.com/file/d/1VP14EBnFS5ggvkiw1se_rdDaTB2BrcOw/view?usp=drive_link","en":"","cq":"Chính phủ","tasks":["nangluc"]},{"id":"nd217","law":"xaydung","type":"Nghị định","ten":"Nghị định số 217/2026/NĐ-CP","so":"217/2026/NĐ-CP","ngaybh":"20/06/2026","hl":"01/07/2026","het":"","thaythe":"Sửa đổi, thay thế các quy định về quản lý dự án đầu tư xây dựng tại Nghị định số 175/2024/NĐ-CP","link":"https://thuvienphapluat.vn/van-ban/Xay-dung-Do-thi/Nghi-dinh-217-2026-ND-CP-huong-dan-Luat-Xay-dung-quan-ly-hoat-dong-xay-dung-696494.aspx","summary":"Quản lý dự án đầu tư xây dựng theo Luật Xây dựng 2025; trình tự dự án, hình thức quản lý, trách nhiệm chủ đầu tư.","noidung":["Quy định về quản lý dự án đầu tư xây dựng theo Luật Xây dựng năm 2025.","Quy định trình tự thực hiện dự án từ chuẩn bị đầu tư, thực hiện đầu tư đến kết thúc xây dựng.","Quy định hình thức quản lý dự án, nhiệm vụ, quyền hạn và trách nhiệm của Chủ đầu tư.","Quy định quản lý tiến độ, chi phí, chất lượng, an toàn lao động và môi trường trong thực hiện dự án."],"diemmoi":["Hoàn thiện cơ chế quản lý dự án phù hợp với Luật Xây dựng số 135/2025/QH15.","Đẩy mạnh phân cấp, phân quyền trong công tác quản lý dự án đầu tư xây dựng.","Bổ sung quy định về chuyển đổi số và ứng dụng BIM trong quản lý dự án.","Hoàn thiện cơ chế quản lý đối với dự án có nhiều công trình, nhiều giai đoạn hoặc nhiều dự án thành phần."],"doc":"https://docs.google.com/document/d/1NluQ-R_2dk2_ILyMBpOeqGASVc3gOpIV/edit?usp=drive_link&amp;ouid=108341869410064376302&amp;rtpof=true&amp;sd=true","pdf":"https://drive.google.com/file/d/10xWmFaJr8x0PKtaEb-wr91C9yLgiZbTe/view?usp=drive_link","en":"","cq":"Chính phủ","tasks":["laduan","chatluong"]},{"id":"xaydung_thutuc","law":"xaydung","type":"Thủ tục","ten":"Thủ tục hành chính lĩnh vực xây dựng","so":"Thủ tục","ngaybh":"","hl":"","het":"","thaythe":"","link":"#","summary":"Xem danh sách thủ tục hành chính thuộc lĩnh vực xây dựng theo dữ liệu Excel.","noidung":["Danh sách thủ tục hành chính lĩnh vực xây dựng được lấy từ file Excel."],"diemmoi":["Khi bấm vào thẻ này, hệ thống hiển thị các thủ tục con tương ứng với lĩnh vực xây dựng."],"doc":"","pdf":"","en":"","cq":"","tasks":["giayphep"]},{"id":"luatdatdai","law":"datdai","type":"Luật","ten":"Luật Đất đai 2024","so":"31/2024/QH15","ngaybh":"18/01/2024","hl":"01/01/2025","het":"","thaythe":"Luật Đất đai 2013","link":"https://thuvienphapluat.vn/van-ban/Bat-dong-san/Luat-Dat-dai-2024-so-31-2024-QH15-523642.aspx","summary":"Quy định chế độ sở hữu toàn dân về đất đai, quản lý nhà nước về đất đai, quyền và nghĩa vụ của người sử dụng đất.","noidung":["Quy định về quản lý và sử dụng đất đai.","Quy định giao đất, cho thuê đất, chuyển mục đích sử dụng đất.","Quy định thu hồi đất, bồi thường, hỗ trợ, tái định cư.","Quy định đăng ký đất đai, cấp giấy chứng nhận, giá đất và tài chính đất đai."],"diemmoi":["Bỏ khung giá đất, hoàn thiện cơ chế bảng giá đất.","Mở rộng trường hợp đấu giá, đấu thầu dự án có sử dụng đất.","Đổi mới quy định về bồi thường, hỗ trợ, tái định cư.","Tăng cường phân cấp và số hóa dữ liệu đất đai."],"doc":"https://docs.google.com/document/d/152Uizn7yYTB1TAHE-f6PFOs_FXTqSgjN/edit?usp=sharing&amp;ouid=108341869410064376302&amp;rtpof=true&amp;sd=true","pdf":"https://drive.google.com/file/d/1dulGpFQhNOx9ATrXuE9HmHTQCnvCSdvu/view?usp=sharing","en":"https://docs.google.com/document/d/13xwn5ZX63K-jkPAiQfGf-orjS6-PcS6s/edit?usp=sharing&amp;oui const $=s=>document.querySelector(s);
const norm=s=>(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d');
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function pd(s){const m=/(\d{1,2})\/(\d{1,2})\/(\d{4})/.exec(s||'');return m?new Date(+m[3],+m[2]-1,+m[1]):null}
const today=new Date();today.setHours(0,0,0,0);
const taskById=Object.fromEntries(TASKS.map(t=>[t.id,t]));
const stageById=Object.fromEntries(STAGES.map(s=>[s.id,s]));

/* ---------- chuẩn hóa dữ liệu ---------- */
function orgOf(d){
  if(d.cq&&d.cq!=='Bộ, ngành')return d.cq;
  const s=d.so||'';
  const m=/\/([^\/]+)$/.exec(s);
  if(m){const k=m[1].replace(/^.*?(BXD|BTC|BTNMT|BNNMT|BNNPTNT|BKHĐT|BCA|BQP|BGTVT|BYT|BCT|BNV|BGDĐT|NHNN).*$/,'$1');if(ORG[k])return ORG[k];if(ORG[m[1]])return ORG[m[1]]}
  if(/QH/.test(s))return 'Quốc hội';
  return d.cq||'Khác';
}
const BARE=/^(Luật|Bộ luật|Nghị định|Thông tư|Nghị quyết|Quyết định|Công văn|Công điện|Chỉ thị|Quy chuẩn)/;
function firstClause(t){
  t=(t||'').replace(/\s+/g,' ').replace(/[.。]+$/,'').trim();
  const m=/^(.{26,}?)[,;]/.exec(t);
  let s=m?m[1]:t;
  if(s.length>95){s=s.slice(0,92).replace(/\s+\S*$/,'')+'…'}
  return s;
}
function headline(d){
  const bare=d.ten.length<=44&&/\d/.test(d.ten)&&BARE.test(d.ten);
  if(bare&&d.summary&&norm(d.summary)!==norm(d.ten)&&d.summary.length>d.ten.length+8)return firstClause(d.summary);
  return d.ten.length>130?d.ten.slice(0,127).replace(/\s+\S*$/,'')+'…':d.ten;
}
function numLine(d){
  const t=d.type==='Thông tư liên tịch'?'':d.type, so=d.so||'';
  if(norm(so).startsWith(norm(d.type)))return so;
  return (t+' '+so).trim();
}
function status(d){
  const e=pd(d.het),h=pd(d.hl);
  if(e&&e<today&&!/\(/.test(d.het))return 'expired';
  if(h&&h>today)return 'soon';
  if(h&&(today-h)/864e5<=60)return 'new';
  return 'active';
}
function branchOf(d){
  if(d.type==='Thủ tục')return 'thutuc';
  if(d._st==='expired'||/sua doi|bo sung|thay the/.test(norm(d.ten).slice(0,70)))return 'cu';
  if(/^(Luật|Bộ luật|Nghị quyết)/.test(d.type)&&!/\//.test(d.ten.replace(/\d+\/\d+\/\d+\/[A-Z]+/,'')) )return 'nentang';
  if(d.type==='Luật'||d.type==='Bộ luật')return 'nentang';
  return 'huongdan';
}
const SEARCHDOCS=[];
const ALL=[];
DOCS.concat(PROC).forEach(d=>{
  if(/^Tra cứu/.test(d.ten)){SEARCHDOCS.push(d);return}
  d._st=status(d); d._br=branchOf(d); d._org=orgOf(d); d._h=headline(d);
  const dt=pd(d.hl)||pd(d.ngaybh); d._ts=dt?dt.getTime():0;
  const y=(d.ngaybh&&/(\d{4})$/.exec(d.ngaybh))||(d.hl&&/(\d{4})$/.exec(d.hl))||/\/(\d{4})\//.exec(d.so||'');
  d._y=y?y[1]:'';
  d._n=norm([d.ten,d.so,d.summary,(d.noidung||[]).join(' '),d._org,d.tasks.map(t=>taskById[t].name).join(' ')].join(' | '));
  d._nt=norm(d.ten+' '+d._h+' '+d.so);
  ALL.push(d);
});
const byId=Object.fromEntries(ALL.map(d=>[d.id,d]));
const cur=d=>d._st!=='expired';
function taskDocs(tid){return ALL.filter(d=>d.tasks.includes(tid))}
function stageTasks(sid){return TASKS.filter(t=>t.stage===sid)}
function stageCount(sid){const ids=new Set();stageTasks(sid).forEach(t=>taskDocs(t.id).filter(cur).forEach(d=>ids.add(d.id)));return ids.size}

/* ---------- trạng thái ---------- */
const S={mode:'j',stage:'',task:'',law:'',branch:'',q:'',grp:'all',validity:'current',year:'',org:'',type:'',sort:'rel',shown:20,advOpen:false};
function resetPage(){S.shown=20}
function hashOf(){return S.mode==='f'?('f'+(S.law?'.'+S.law:'')):(S.stage?S.stage+(S.task?'.'+S.task:''):'')}
function applyHash(){
  const h=(location.hash||'').replace('#','');
  if(!h){return}
  const [a,b]=h.split('.');
  if(a==='f'){S.mode='f';S.law=LAWS[b]?b:'';S.stage=S.task=''}
  else if(stageById[a]){S.mode='j';S.stage=a;S.task=(b&&taskById[b]&&taskById[b].stage===a)?b:'';S.law=''}
}
function setHash(){try{const h=hashOf();history.replaceState(null,'',h?'#'+h:location.pathname+location.search)}catch(e){}}

/* ---------- lọc & xếp ---------- */
function groupOf(d){return d.type==='Luật'||d.type==='Bộ luật'?'Luật':d.type==='Nghị định'?'Nghị định':/^Thông tư/.test(d.type)?'Thông tư':'other'}
function baseSet(){
  if(S.q.trim())return ALL;
  if(S.mode==='f')return S.law?ALL.filter(d=>d.law===S.law):[];
  if(S.task)return taskDocs(S.task);
  if(S.stage)return ALL.filter(d=>d.tasks.some(t=>taskById[t].stage===S.stage));
  return [];
}
function applyFilters(list,opt){
  opt=opt||{};
  const terms=norm(S.q).split(/\s+/).filter(Boolean);
  let out=list.filter(d=>{
    if(S.task&&S.branch&&!S.q&&d._br!==S.branch)return false;
    if(S.validity==='current'&&!(S.branch==='cu'&&S.task&&!S.q)&&d._st==='expired')return false;
    if(S.validity==='expired'&&d._st!=='expired')return false;
    if(S.grp!=='all'&&groupOf(d)!==S.grp)return false;
    if(S.type&&d.type!==S.type)return false;
    if(S.year&&d._y!==S.year)return false;
    if(S.org&&d._org!==S.org)return false;
    if(opt.task&&!d.tasks.includes(opt.task))return false;
    if(terms.length&&!terms.every(t=>d._n.includes(t)))return false;
    return true;
  });
  const sc=d=>{let s=0;terms.forEach(t=>{if(d._nt.includes(t))s+=10;if(norm(d.so)===t)s+=60;else if(norm(d.so).includes(t))s+=20});return s+(d._st==='expired'?-5:0)};
  if(S.sort==='new')out.sort((a,b)=>b._ts-a._ts);
  else if(S.sort==='old')out.sort((a,b)=>a._ts-b._ts);
  else if(terms.length)out.sort((a,b)=>sc(b)-sc(a)||b._ts-a._ts);
  else out.sort((a,b)=>(a._br===b._br?0:BRANCHES.findIndex(x=>x.id===a._br)-BRANCHES.findIndex(x=>x.id===b._br))||b._ts-a._ts);
  return out;
}
function hl(text){
  let t=esc(text);const terms=norm(S.q).split(/\s+/).filter(x=>x.length>1);
  if(!terms.length)return t;
  const n=norm(text);if(n.length!==text.length)return t;
  const ranges=[];terms.forEach(k=>{let i=0;while((i=n.indexOf(k,i))>-1){ranges.push([i,i+k.length]);i+=k.length}});
  if(!ranges.length)return t;
  ranges.sort((a,b)=>a[0]-b[0]);const m=[];ranges.forEach(r=>{const l=m[m.length-1];if(l&&r[0]<=l[1])l[1]=Math.max(l[1],r[1]);else m.push(r.slice())});
  let o='',p=0;m.forEach(r=>{o+=esc(text.slice(p,r[0]))+'<mark>'+esc(text.slice(r[0],r[1]))+'</mark>';p=r[1]});return o+esc(text.slice(p));
}

function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2200)}
function copy(text,msg){
  const fb=()=>{const ta=document.createElement('textarea');ta.value=text;ta.style.cssText='position:fixed;left:-999px';document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(msg)}catch(e){toast('Không sao chép tự động được. Hãy chọn và sao chép thủ công.')}ta.remove()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(()=>toast(msg),fb)}else fb();

  const t=e.target.closest('[data-open],[data-stage],[data-task],[data-branch],[data-grp],[data-goto],[data-law],[data-reset],#moreBtn,#modeJ,#modeF,#clr,[data-q]');
  if(!t)return;
  if(t.dataset.open){closeDoc();openDoc(t.dataset.open);return}
  if(t.dataset.stage!==undefined){S.mode='j';S.q='';$('#q').value='';S.stage=t.dataset.stage===S.stage&&!t.closest('.crumbs')?'':t.dataset.stage;S.task='';clearFilters();render();if(S.stage)scrollTo('#stagePanel');return}
  if(t.dataset.task){S.task=t.dataset.task;clearFilters();render();scrollTo('#taskPanel');return}
  if(t.dataset.goto){const id=t.dataset.goto;closeDoc();S.mode='j';S.q='';$('#q').value='';S.stage=taskById[id].stage;S.task=id;clearFilters();render();scrollTo('#taskPanel');return}

  if(t.dataset.grp){S.grp=t.dataset.grp;resetPage();render();return}
  if(t.dataset.law){S.law=S.law===t.dataset.law?'':t.dataset.law;clearFilters();render();if(S.law)scrollTo('#results');return}
  if(t.dataset.q){$('#q').value=t.dataset.q;S.q=t.dataset.q;clearFilters();render();scrollTo('#results');return}
  if(t.hasAttribute('data-reset')){S.stage=S.task='';clearFilters();render();return}
  if(t.id==='moreBtn'){S.shown+=20;render();return}
  if(t.id==='modeJ'){S.mode='j';S.law='';render();return}
  if(t.id==='modeF'){S.mode='f';S.stage=S.task='';render();return}
  if(t.id==='clr'){S.q='';$('#q').value='';$('#q').focus();render();return}
});
document.addEventListener('change',e=>{
  const id=e.target.id;
  if(id==='tgOld'){S.validity=e.target.checked?'all':'current'}
  else if(id==='selSort'){S.sort=e.target.value}
  else if(id==='fType'){S.type=e.target.value}
  else if(id==='fYear'){S.year=e.target.value}
  else if(id==='fOrg'){S.org=e.target.value}
  else if(id==='fVal'){S.validity=e.target.value}
  else return;
  S.advOpen=!!(S.type||S.year||S.org||S.validity==='expired'||id.startsWith('f'));
  resetPage();render();
});
document.addEventListener('toggle',e=>{if(e.target.id==='adv')S.advOpen=e.target.open},true);
let qt;
$('#q').addEventListener('input',e=>{clearTimeout(qt);qt=setTimeout(()=>{S.q=e.target.value;if(S.q.trim()){S.branch='';S.grp='all'}resetPage();render()},160)});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeDoc();
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus()}
});
$('#scrim').addEventListener('click',closeDoc);
document.addEventListener('click',e=>{if(e.target.id==='dClose')closeDoc()});
window.addEventListener('hashchange',()=>{applyHash();render()});

$('#quick').innerHTML='<span>Tra nhanh:</span>'+['hợp đồng xây dựng','đánh giá tác động môi trường','tiền sử dụng đất','giấy phép xây dựng','đấu thầu','nhà ở xã hội','quyết toán'].map(k=>'<button data-q="'+esc(k)+'">'+esc(k)+'</button>').join('');
applyHash();render();
</script>
